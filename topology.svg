<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#020617"/>

  <!-- Title -->
  <text x="620" y="44" fill="#e2e8f0" font-size="26" font-weight="bold" text-anchor="middle">reasoning-gate 拓扑</text>
  <text x="620" y="70" fill="#64748b" font-size="15" text-anchor="middle">Kev-4B 实时决策 reasoning_effort 的中间层</text>

  <!-- Clients -->
  <rect x="40" y="120" width="210" height="80" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="145" y="155" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Hermes</text>
  <text x="145" y="180" fill="#94a3b8" font-size="13" text-anchor="middle">chat_completions</text>

  <rect x="40" y="240" width="210" height="80" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="145" y="275" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Codex</text>
  <text x="145" y="300" fill="#94a3b8" font-size="13" text-anchor="middle">responses</text>

  <!-- kev-proxy core -->
  <rect x="380" y="110" width="300" height="240" rx="12" fill="#0c1a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="530" y="142" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">reasoning-gate</text>
  <text x="530" y="163" fill="#7dd3fc" font-size="13" text-anchor="middle">:8910  (本机 loopback)</text>
  <line x1="405" y1="178" x2="655" y2="178" stroke="#1e3a5f" stroke-width="1"/>
  <text x="405" y="205" fill="#cbd5e1" font-size="14">• 剥系统包装 (cron/skill/memory)</text>
  <text x="405" y="232" fill="#cbd5e1" font-size="14">• lease 缓存 (锚定最新用户消息)</text>
  <text x="405" y="259" fill="#cbd5e1" font-size="14">• none 置信度护栏</text>
  <text x="405" y="286" fill="#cbd5e1" font-size="14">• fail-open (Kev 挂→兜底 effort)</text>
  <text x="405" y="313" fill="#cbd5e1" font-size="14">• 全量 JSONL 审计</text>

  <!-- Kev-4B decision -->
  <rect x="820" y="110" width="360" height="120" rx="12" fill="#12241a" stroke="#34d399" stroke-width="2"/>
  <text x="1000" y="145" fill="#34d399" font-size="19" font-weight="bold" text-anchor="middle">Kev-4B 决策服务</text>
  <text x="1000" y="170" fill="#86efac" font-size="13" text-anchor="middle">192.168.1.10:8905  /v1/systemone</text>
  <text x="1000" y="195" fill="#6ee7b7" font-size="12" text-anchor="middle">dohnuts.cpp HIP · Q8_0 全量 GPU · ~4.4GB VRAM</text>
  <text x="1000" y="216" fill="#6ee7b7" font-size="12" text-anchor="middle">一次前向答 effort + lease</text>

  <!-- Backend -->
  <rect x="820" y="320" width="360" height="120" rx="12" fill="#1a1230" stroke="#c084fc" stroke-width="2"/>
  <text x="1000" y="355" fill="#c084fc" font-size="19" font-weight="bold" text-anchor="middle">推理后端 (halogen)</text>
  <text x="1000" y="380" fill="#d8b4fe" font-size="13" text-anchor="middle">192.168.1.20:8731</text>
  <text x="1000" y="405" fill="#c4b5fd" font-size="12" text-anchor="middle">接受 reasoning_effort 注入</text>
  <text x="1000" y="426" fill="#c4b5fd" font-size="12" text-anchor="middle">minimal / low / medium / high / xhigh / none</text>

  <!-- Arrows: clients -> proxy -->
  <line x1="250" y1="160" x2="378" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="250" y1="280" x2="378" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- proxy -> kev (ask) -->
  <line x1="680" y1="170" x2="818" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="748" y="150" fill="#34d399" font-size="12" text-anchor="middle">① 问 effort</text>
  <!-- kev -> proxy (answer) -->
  <line x1="818" y1="200" x2="682" y2="210" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <text x="748" y="228" fill="#34d399" font-size="12" text-anchor="middle">② effort + lease</text>

  <!-- proxy -> backend (forward) -->
  <line x1="680" y1="290" x2="818" y2="370" stroke="#c084fc" stroke-width="2" marker-end="url(#arrv)"/>
  <text x="755" y="312" fill="#c084fc" font-size="12" text-anchor="middle">③ 注入 effort 转发</text>

  <!-- backend -> proxy -> client (response) -->
  <line x1="818" y1="420" x2="682" y2="330" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrv)"/>
  <text x="760" y="392" fill="#94a3b8" font-size="12" text-anchor="middle">④ 回传</text>

  <!-- legend -->
  <rect x="40" y="490" width="1140" height="130" rx="10" fill="#0a1220" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="520" fill="#94a3b8" font-size="15" font-weight="bold">数据流</text>
  <line x1="60" y1="545" x2="100" y2="545" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="115" y="550" fill="#cbd5e1" font-size="13">请求进入代理</text>
  <line x1="280" y1="545" x2="320" y2="545" stroke="#34d399" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="335" y="550" fill="#cbd5e1" font-size="13">决策请求 / 实线</text>
  <line x1="520" y1="545" x2="560" y2="545" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <text x="575" y="550" fill="#cbd5e1" font-size="13">决策返回 / 虚线</text>
  <line x1="760" y1="545" x2="800" y2="545" stroke="#c084fc" stroke-width="2" marker-end="url(#arrv)"/>
  <text x="815" y="550" fill="#cbd5e1" font-size="13">转发到后端</text>

  <text x="60" y="585" fill="#64748b" font-size="13">关键：lease 命中时跳过 ①②，直接走 ③④（夜间实测 ~69% 请求零决策开销）。Kev 不可用时 fail-open，保持客户端默认 effort，请求不中断。</text>
  <text x="60" y="608" fill="#64748b" font-size="13">IP 为占位地址（192.168.x.x），实际部署按各自拓扑通过环境变量配置。</text>
</svg>
