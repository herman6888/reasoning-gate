  <text x="40" y="360" fill="#334155" font-size="13">On a lease hit the decision step is skipped and the request is forwarded directly (~69% of overnight requests, zero decision cost).</text>
  <text x="40" y="384" fill="#334155" font-size="13">If Kev is unavailable, fail-open keeps the client's default effort; the request is never blocked.</text>
  <text x="40" y="408" fill="#94a3b8" font-size="12">IPs are placeholders; configure real hosts via environment variables.</text>

  <text x="40" y="448" fill="#0f172a" font-size="14" font-weight="bold">Overnight cron measurement (3 comparable tasks; baseline = 9/20-9/23 halogen average)</text>
  <line x1="40" y1="460" x2="960" y2="460" stroke="#cbd5e1" stroke-width="1"/>
